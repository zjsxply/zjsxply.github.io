name: Update citations

on:
  schedule:
    # GitHub schedules use UTC; this runs at Monday 08:00 in Asia/Shanghai.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Update citation counts from SerpApi, Semantic Scholar, and ADS
        run: python bin/update_scholar_citations_serpapi.py

      - name: Commit updated citation counts
        id: commit
        run: |
          status="$(git status --porcelain --untracked-files=all -- _data/publications.yml _data/publications.zh.yml _data/publication_cited_documents.yml)"
          if [ -z "$status" ]; then
            echo "No citation changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Citation files changed:"
          echo "$status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml _data/publications.zh.yml _data/publication_cited_documents.yml
          git commit -m "Update citation counts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site deployment
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy.yml/dispatches"
